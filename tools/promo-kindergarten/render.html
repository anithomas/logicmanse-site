<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(assets/Poppins-Regular.ttf)}
@font-face{font-family:P;font-weight:500;src:url(assets/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(assets/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(assets/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fdf3dc;font-family:P,sans-serif;color:#25213f}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  background:linear-gradient(180deg,#fff6e4 0%,#fdf0cd 100%)}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
.h1{font-weight:700;font-size:104px;line-height:112px;white-space:nowrap}
.w{display:inline-block;transform-origin:50% 80%}
.card{background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(120,80,20,.22),0 6px 14px rgba(120,80,20,.12)}
.chip{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:0 34px;height:66px;
  font-weight:600;font-size:30px;color:#fff;white-space:nowrap}
.body{font-weight:500;font-size:36px;line-height:54px;color:#3a3556}
svg{overflow:visible}
</style></head>
<body><div id="stage"></div>
<script src="scene.js"></script>
</body></html>
